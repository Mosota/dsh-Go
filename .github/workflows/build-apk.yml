name: Build DSH Go APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # 代码已迁到 Mosota/DSH-Go-Plus；这个仓库只保留签名密钥，
      # 所以在这里构建、检出的是新仓库的代码，签名仍用本仓库的 secrets。
      # 源码基线换成上游 v1.2.0；我们自己的改动放在 DSH-Go-Plus 的 patches/ 里，
      # 由下面一步逐个应用（手机端推不动整棵 1.2.0 的树，补丁只有 1 MB）。
      - uses: actions/checkout@v4
        with:
          repository: ccch1mneyyy/dsh-Go
          ref: v1.2.0
      - name: Apply our delta on top of v1.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sSL --retry 5 --retry-all-errors -m 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://raw.githubusercontent.com/Mosota/DSH-Go-Plus/main/patches/plus-v1.2.0.patch \
            -o /tmp/plus.patch
          test $(stat -c%s /tmp/plus.patch) -gt 500000 || { echo "patch is too small, likely an error page"; head -c 300 /tmp/plus.patch; exit 1; }
          git apply --3way /tmp/plus.patch
          git status --short > /tmp/status.txt || true
          head -20 /tmp/status.txt || true
          test -f app/lib/ui/phone/background_advanced.dart || { echo "our files are missing after the patch"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.DSHGO_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.DSHGO_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p app/android/keystore
          echo "$KEYSTORE_B64" | base64 -d > app/android/keystore/release.jks
          printf 'storeFile=../keystore/release.jks\nstorePassword=%s\nkeyAlias=dshgo\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > app/android/key.properties
          chmod 600 app/android/keystore/release.jks
      - name: Assemble runtime (mechanism from this repo, metadata from the official APK)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # gh downloader: it follows the asset redirects itself and fails loudly instead of
          # saving an error body as if it were the APK.
          gh release download v1.2.0 --repo ccch1mneyyy/dsh-Go \
            --pattern 'dsh-go-1.2.0-arm64.apk' --output /tmp/upstream.apk --clobber
          ls -la /tmp/upstream.apk
          test $(stat -c%s /tmp/upstream.apk) -gt 100000000 || { echo "upstream APK is not the real one"; head -c 300 /tmp/upstream.apk; exit 1; }
          RT=runtime/out/arm64-v8a
          mkdir -p "$RT/assets/runtime" "$RT/jniLibs/arm64-v8a" /tmp/up
          unzip -o -q -j /tmp/upstream.apk 'assets/runtime/manifest.json' -d /tmp/up    # -j: lands as /tmp/up/manifest.json
          unzip -o -q -j /tmp/upstream.apk 'assets/runtime/rootfs-arm64-v8a.tar.xz' -d "$RT/assets/runtime"
          unzip -o -q -j /tmp/upstream.apk 'assets/runtime/licenses/*' -d "$RT/assets/runtime/licenses"
          # 官方 1.2.0 用的是 proot（libproot.so + loader + talloc + shmem），不再是 proroot。
          # 我们的 proroot 只做路径翻译，和新 rootfs 的启动参数对不上——1.2.0 起直接用官方那套。
          unzip -o -q -j /tmp/upstream.apk 'lib/arm64-v8a/*.so' -d "$RT/jniLibs/arm64-v8a/"
          ls -la "$RT/jniLibs/arm64-v8a/"
          python3 - <<'PY'
          import hashlib, json
          up = json.load(open('/tmp/up/manifest.json'))
          # 官方 launch 保持原样（proroot 时代我们覆盖过 launch/jniLibs，1.2.0 起那会换掉
          # 官方 proot 的启动语义：--sysvipc / -L / PROOT_L2S_DIR 全丢，guest 里 DNS 和
          # 联网随之失效）。这里只补我们需要的存储挂载。
          argv = up['launch']['argv']
          extra = ['-b', '/storage/emulated/0:/sdcard', '-b', '/storage:/storage']
          if not any(x.endswith(':/sdcard') for x in argv):
              if '/usr/bin/env' in argv:
                  i = argv.index('/usr/bin/env')
                  argv[i:i] = extra
              else:
                  argv.extend(extra)
          p = 'runtime/out/arm64-v8a/assets/runtime/rootfs-arm64-v8a.tar.xz'
          got = hashlib.sha256(open(p, 'rb').read()).hexdigest()
          print('rootfs', got, 'expected', up['rootfsSha256'])
          assert got == up['rootfsSha256'], 'rootfs sha mismatch: the official APK is not the one this build read'
          json.dump(up, open('runtime/out/arm64-v8a/assets/runtime/manifest.json', 'w'), ensure_ascii=False, indent=2)
          print('runtimeVersion', up.get('runtimeVersion'))
          print('launch head:', argv[:3], '... binds:', [a for a in argv if 'sdcard' in a or 'storage' in a])
          PY
          ls -la "$RT/assets/runtime" "$RT/jniLibs/arm64-v8a"
      # —— 缓存：NDK/CMake 与 Gradle 依赖每次重建都要重新下载，占掉约 4 分钟 ——
      - name: Cache Android NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/cmake
          key: android-ndk-cmake-${{ runner.os }}-r28c-cmake322-v1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Gradle mirrors (the upstream kotlin compiler jar 504s from GitHub releases)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/mirrors.gradle <<'EOF'
          // Settings-level only: this build uses PREFER_SETTINGS repositories, so adding them to
          // projects would fail configuration instead of helping.
          def mirrors = [
            'https://maven.aliyun.com/repository/central',
            'https://maven.aliyun.com/repository/google',
            'https://maven.aliyun.com/repository/gradle-plugin',
          ]
          def official = { repos ->
            repos.maven { url 'https://dl.google.com/dl/android/maven2' }
            repos.maven { url 'https://repo.maven.apache.org/maven2' }
            repos.maven { url 'https://plugins.gradle.org/m2' }
          }
          settingsEvaluated { s ->
            s.pluginManagement.repositories { official(delegate); mirrors.each { u -> maven { url u } } }
            s.buildscript.repositories { official(delegate); mirrors.each { u -> maven { url u } } }
            try {
              s.dependencyResolutionManagement.repositories { official(delegate); mirrors.each { u -> maven { url u } } }
            } catch (Exception ignored) {
              // An older Gradle without that block still gets the plugin mirrors above.
            }
          }
          EOF
      - name: Flutter pub get
        run: cd app && flutter pub get
      # 先只做静态分析：Dart 的编译错误在 1–2 分钟内一次列全，
      # 不必等 10 分钟的 Gradle 打包才发现第一条错误。
      - name: Analyze Dart (fail fast, full error list)
        run: |
          set -uo pipefail
          cd app
          # 只让 error 拦住构建；warning/info 照常打印但不影响出包。
          dart analyze lib | tee /tmp/analyze.txt || true
          if grep -qE '^[[:space:]]*error ' /tmp/analyze.txt; then
            echo "::error::Dart 分析发现编译级错误（见上）"
            exit 1
          fi
          echo "no compile-level errors"

      - name: Build arm64 release APK
        run: |
          cd app
          # The in-app update checker reads the pubspec version, the store reads the flags
          # below: keep them equal or a build offers itself as an update.
          sed -i "s/^version: .*/version: 1.2.0+102000001/" pubspec.yaml
          grep -n "^version:" pubspec.yaml
          flutter build apk --release --flavor arm64 --target-platform android-arm64 \
            --build-name 1.2.0 --build-number 102000001 \
            --dart-define=DSH_APP_VERSION=1.2.0+102000001
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-release
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
