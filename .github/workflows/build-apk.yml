name: Build DSH Go APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.DSHGO_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.DSHGO_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p app/android/keystore
          echo "$KEYSTORE_B64" | base64 -d > app/android/keystore/release.jks
          printf 'storeFile=../keystore/release.jks\nstorePassword=%s\nkeyAlias=dshgo\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > app/android/key.properties
          chmod 600 app/android/keystore/release.jks
      - name: Assemble runtime (mechanism from this repo, metadata from the official APK)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # gh downloader: it follows the asset redirects itself and fails loudly instead of
          # saving an error body as if it were the APK.
          gh release download v1.0.16 --repo ccch1mneyyy/dsh-Go \
            --pattern 'dsh-go-1.0.16-arm64.apk' --output /tmp/upstream.apk --clobber
          ls -la /tmp/upstream.apk
          test $(stat -c%s /tmp/upstream.apk) -gt 100000000 || { echo "upstream APK is not the real one"; head -c 300 /tmp/upstream.apk; exit 1; }
          RT=runtime/out/arm64-v8a
          mkdir -p "$RT/assets/runtime" "$RT/jniLibs/arm64-v8a" /tmp/up
          unzip -o -q -j /tmp/upstream.apk 'assets/runtime/manifest.json' -d /tmp/up    # -j: lands as /tmp/up/manifest.json
          unzip -o -q -j /tmp/upstream.apk 'assets/runtime/rootfs-arm64-v8a.tar.xz' -d "$RT/assets/runtime"
          unzip -o -q -j /tmp/upstream.apk 'assets/runtime/licenses/*' -d "$RT/assets/runtime/licenses"
          cp tooling/proroot/jniLibs/arm64-v8a/*.so "$RT/jniLibs/arm64-v8a/"
          python3 - <<'PY'
          import hashlib, json
          up = json.load(open('/tmp/up/manifest.json'))
          ours = json.load(open('tooling/proroot/manifest.json'))
          for k in ('launch', 'jniLibs', 'prorootVersion'):
              if k in ours:
                  up[k] = ours[k]
          p = 'runtime/out/arm64-v8a/assets/runtime/rootfs-arm64-v8a.tar.xz'
          got = hashlib.sha256(open(p, 'rb').read()).hexdigest()
          print('rootfs', got, 'expected', up['rootfsSha256'])
          assert got == up['rootfsSha256'], 'rootfs sha mismatch: the official APK is not the one this build read'
          json.dump(up, open('runtime/out/arm64-v8a/assets/runtime/manifest.json', 'w'), ensure_ascii=False, indent=2)
          print('runtimeVersion', up.get('runtimeVersion'))
          PY
          ls -la "$RT/assets/runtime" "$RT/jniLibs/arm64-v8a"
      - name: Gradle mirrors (the upstream kotlin compiler jar 504s from GitHub releases)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/mirrors.gradle <<'EOF'
          // Settings-level only: this build uses PREFER_SETTINGS repositories, so adding them to
          // projects would fail configuration instead of helping.
          def mirrors = [
            'https://maven.aliyun.com/repository/central',
            'https://maven.aliyun.com/repository/google',
            'https://maven.aliyun.com/repository/gradle-plugin',
          ]
          settingsEvaluated { s ->
            s.pluginManagement.repositories { mirrors.each { u -> maven { url u } } }
            s.buildscript.repositories { mirrors.each { u -> maven { url u } } }
            try {
              s.dependencyResolutionManagement.repositories { mirrors.each { u -> maven { url u } } }
            } catch (Exception ignored) {
              // An older Gradle without that block still gets the plugin mirrors above.
            }
          }
          EOF
      - name: Flutter pub get
        run: cd app && flutter pub get
      - name: Build arm64 release APK
        run: |
          cd app
          flutter build apk --release --flavor arm64 --target-platform android-arm64 \
            --build-name 1.0.16 --build-number 10416001
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-release
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
